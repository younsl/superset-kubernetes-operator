<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="420" viewBox="0 0 1010 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1010" height="420" rx="12" fill="#ffffff"/>

  <text x="16" y="34" font-size="15" font-weight="600" fill="#0f172a">Pre-upgrade backup in the lifecycle pipeline</text>

  <!-- Pipeline -->
  <g font-size="13" text-anchor="middle">
    <rect x="16" y="64" width="150" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="91" y="86" fill="#0f172a" font-weight="600">Image change</text>
    <text x="91" y="104" fill="#475569" font-size="11.5">or key rotation</text>

    <rect x="190" y="64" width="150" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <text x="265" y="86" fill="#0f172a" font-weight="600">Upgrade approval</text>
    <text x="265" y="104" fill="#475569" font-size="11.5">Supervised mode only</text>

    <rect x="364" y="64" width="160" height="52" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
    <text x="444" y="86" fill="#1e3a8a" font-weight="600">Backup Job</text>
    <text x="444" y="104" fill="#1d4ed8" font-size="11.5">components keep serving</text>

    <rect x="548" y="64" width="110" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="603" y="86" fill="#0f172a" font-weight="600">Drain</text>
    <text x="603" y="104" fill="#475569" font-size="11.5">maintenance page</text>

    <rect x="682" y="64" width="150" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="757" y="86" fill="#0f172a" font-weight="600">Migrate, Rotate, Init</text>
    <text x="757" y="104" fill="#475569" font-size="11.5">database changes</text>

    <rect x="856" y="64" width="138" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="925" y="86" fill="#0f172a" font-weight="600">Components</text>
    <text x="925" y="104" fill="#475569" font-size="11.5">recreated</text>
  </g>

  <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="166" y1="90" x2="188" y2="90"/>
    <line x1="340" y1="90" x2="362" y2="90"/>
    <line x1="658" y1="90" x2="680" y2="90"/>
    <line x1="832" y1="90" x2="854" y2="90"/>
  </g>
  <line x1="524" y1="90" x2="546" y2="90" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="536" y="58" font-size="11" text-anchor="middle" fill="#1d4ed8">verified</text>

  <!-- Inside the backup Job -->
  <line x1="444" y1="116" x2="444" y2="158" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="4 3"/>
  <rect x="16" y="160" width="978" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="32" y="183" font-size="12.5" font-weight="600" fill="#334155">Inside the backup Job</text>

  <!-- Metastore -->
  <g>
    <path d="M36,212 a56,9 0 0,0 112,0 v52 a56,9 0 0,1 -112,0 z" fill="#ffffff" stroke="#94a3b8"/>
    <ellipse cx="92" cy="212" rx="56" ry="9" fill="#ffffff" stroke="#94a3b8"/>
    <text x="92" y="244" font-size="12.5" text-anchor="middle" font-weight="600" fill="#0f172a">Metastore</text>
    <text x="92" y="260" font-size="10.5" text-anchor="middle" fill="#475569">PostgreSQL, MySQL</text>
  </g>
  <line x1="150" y1="236" x2="194" y2="236" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="172" y="228" font-size="10.5" text-anchor="middle" fill="#475569">read</text>

  <!-- Steps -->
  <g font-size="12" text-anchor="middle">
    <rect x="196" y="212" width="96" height="48" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="244" y="232" font-weight="600" fill="#0f172a">Preflight</text>
    <text x="244" y="249" font-size="10.5" fill="#475569">connect, version</text>

    <rect x="304" y="212" width="96" height="48" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="352" y="232" font-weight="600" fill="#0f172a">Dump</text>
    <text x="352" y="249" font-size="10.5" fill="#475569">to .partial</text>

    <rect x="412" y="212" width="96" height="48" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="460" y="232" font-weight="600" fill="#0f172a">Verify</text>
    <text x="460" y="249" font-size="10.5" fill="#475569">full read back</text>

    <rect x="520" y="212" width="96" height="48" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="568" y="232" font-weight="600" fill="#0f172a">Commit</text>
    <text x="568" y="249" font-size="10.5" fill="#475569">SHA-256 re-check</text>

    <rect x="628" y="212" width="96" height="48" rx="7" fill="#ffffff" stroke="#93c5fd"/>
    <text x="676" y="232" font-weight="600" fill="#0f172a">Manifest</text>
    <text x="676" y="249" font-size="10.5" fill="#475569">commit marker</text>

    <rect x="736" y="212" width="96" height="48" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-dasharray="4 3"/>
    <text x="784" y="232" font-weight="600" fill="#0f172a">Retention</text>
    <text x="784" y="249" font-size="10.5" fill="#475569">keepLast, own UID</text>
  </g>
  <g stroke="#2563eb" stroke-width="1.4" fill="none" marker-end="url(#arrow-blue)">
    <line x1="292" y1="236" x2="302" y2="236"/>
    <line x1="400" y1="236" x2="410" y2="236"/>
    <line x1="508" y1="236" x2="518" y2="236"/>
    <line x1="616" y1="236" x2="626" y2="236"/>
    <line x1="724" y1="236" x2="734" y2="236"/>
  </g>

  <!-- Backup PVC -->
  <g>
    <path d="M862,212 a56,9 0 0,0 112,0 v52 a56,9 0 0,1 -112,0 z" fill="#ffffff" stroke="#94a3b8"/>
    <ellipse cx="918" cy="212" rx="56" ry="9" fill="#ffffff" stroke="#94a3b8"/>
    <text x="918" y="244" font-size="12.5" text-anchor="middle" font-weight="600" fill="#0f172a">Backup PVC</text>
    <text x="918" y="260" font-size="11" text-anchor="middle" fill="#475569">dump and manifest</text>
  </g>
  <line x1="832" y1="236" x2="860" y2="236" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="196" y="290" font-size="11" fill="#475569">Dumps are owner only (0600) and never overwritten. Credentials come from Secret references; the operator never reads them.</text>
  <text x="918" y="290" font-size="11" text-anchor="middle" fill="#475569">user owned</text>

  <!-- Outcomes -->
  <line x1="176" y1="310" x2="176" y2="340" stroke="#dc2626" stroke-width="1.4" marker-end="url(#arrow-red)"/>
  <text x="184" y="330" font-size="10.5" fill="#b91c1c">any step fails</text>
  <rect x="16" y="342" width="340" height="60" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="32" y="365" font-size="13" font-weight="600" fill="#991b1b">Upgrade blocked</text>
  <text x="32" y="384" font-size="11.5" fill="#7f1d1d">Current version keeps serving; the failing step</text>
  <text x="32" y="398" font-size="11.5" fill="#7f1d1d">and its error are shown in status</text>

  <line x1="676" y1="310" x2="676" y2="340" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrow-blue)"/>
  <text x="684" y="330" font-size="10.5" fill="#1d4ed8">termination message</text>
  <rect x="470" y="342" width="410" height="60" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="486" y="365" font-size="13" font-weight="600" fill="#1e3a8a">Operator records the verified backup</text>
  <text x="486" y="384" font-size="11.5" fill="#1e40af">status.lifecycle.backups: location, SHA-256,</text>
  <text x="486" y="398" font-size="11.5" fill="#1e40af">Alembic revision, image to restore with</text>
</svg>
